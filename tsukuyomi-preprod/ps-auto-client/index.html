<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101010" />
    <meta name="color-scheme" content="dark" />
    <title>Tsukuyomi · Centre de commande</title>
    <link id="tsukuyomi-theme" rel="stylesheet" href="../tsukuyomi-theme.css?rev=landing-unified" />
    <link rel="stylesheet" href="./tickets.css?rev=played-ticket-details" />
    <link rel="stylesheet" href="./ticketFilters.css?rev=landing-unified" />
    <link rel="stylesheet" href="./theme.css?rev=panel-unified" />
    <script type="module">
      import { startPsAutoDashboard } from "./source.js?rev=shared-landing-ticket";
      startPsAutoDashboard();
    </script>
    <style>
      html:has(#root[hidden]) { background: var(--tsukuyomi-bg, #101010); }
      #ps-auto-status {
        background: var(--tsukuyomi-panel, #101010);
        color: var(--tsukuyomi-ink, #f4f4f5);
        font: 14px/1.5 var(--tsukuyomi-body, system-ui, sans-serif);
        padding: 12px 16px;
      }
      #ps-auto-status button {
        background: var(--tsukuyomi-bg, #101010);
        border: 1px solid var(--tsukuyomi-border, #505050);
        border-radius: var(--tsukuyomi-control-radius, 6px);
        color: inherit;
        cursor: pointer;
        margin-inline-start: 10px;
        min-height: 40px;
        padding-inline: 12px;
      }
      #ps-auto-status button:hover { border-color: var(--tsukuyomi-accent); }
      #ps-auto-status button:focus-visible { outline: 2px solid var(--tsukuyomi-accent); outline-offset: 2px; }
      #root[hidden], #ps-auto-status[hidden],
      #root nav[aria-label="Rubriques"] [role="tab"][hidden],
      #root nav[aria-label="Rubriques"] > button[title="Diagnostics"],
      .psa-app-header-alert,
      #root[data-tsukuyomi-editorial] > div > section[aria-label="Filtres"],
      #root section[aria-label="Indicateurs clés"],
      #root section[aria-label="Calendrier des matchs"] > p[role="status"],
      #calendar-filter-options [hidden],
      #root section[aria-label="Pronostics associés à ce match"],
      .dashboard-home-left > section[aria-label="Derniers pronostics"],
      [data-tsukuyomi-native-feed],
      section[data-tsukuyomi-latest] > :not(h2, .tsukuyomi-ticket-feed) { display: none !important; }
      #root > div > nav[aria-label="Rubriques"] > div[role="tablist"] {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    </style>
  </head>
  <body>
    <div id="ps-auto-status" role="status">Chargement de ton espace…</div>
    <div id="root" hidden></div>
  </body>
</html>
